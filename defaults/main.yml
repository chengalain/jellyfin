---
jellyfin_namespace: jellyfin
jellyfin_release_name: jellyfin

jellyfin_chart_repo_name: jellyfin
jellyfin_chart_repo_url: https://jellyfin.github.io/jellyfin-helm
jellyfin_chart_ref: jellyfin/jellyfin
jellyfin_chart_version: ""

jellyfin_image_tag: ""

jellyfin_config_storage_size: 1Gi
jellyfin_storage_class: local-path
jellyfin_media_storage_enabled: false

jellyfin_resources_requests_cpu: 250m
jellyfin_resources_requests_memory: 512Mi
jellyfin_resources_limits_cpu: "1"
jellyfin_resources_limits_memory: 1Gi

jellyfin_service_monitor_enabled: true
